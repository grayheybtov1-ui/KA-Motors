<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Shadow Gradient -->
    <radialGradient id="carShadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.6)" />
      <stop offset="70%" stop-color="rgba(0, 0, 0, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <!-- Metallic Reflection Gradient for Car Windows -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Chrome Trim Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Headlight Gradient -->
    <linearGradient id="headlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Rear Light Gradient -->
    <linearGradient id="taillightGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .car-body { transition: fill 0.4s ease; }
    .car-wheel { transition: transform 0.8s ease; transform-origin: center; }
    .car-wheel-rim { transition: stroke 0.4s ease, fill 0.4s ease; }
    .neon-glow { transition: fill 0.4s ease, opacity 0.4s ease; }
  </style>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="305" rx="350" ry="25" fill="url(#carShadow)" />

  <!-- Neon Underglow (Interactive) -->
  <ellipse id="underglow" cx="400" cy="300" rx="270" ry="12" fill="#00e5ff" opacity="0.3" class="neon-glow" filter="blur(8px)" />

  <!-- Main Car Group -->
  <g id="full-car">
    
    <!-- 1. Background elements (wheels back rim, suspension shadows) -->
    <circle cx="210" cy="270" r="50" fill="#090d16" />
    <circle cx="590" cy="270" r="50" fill="#090d16" />

    <!-- 2. Car Paint Body (This path gets colored dynamically) -->
    <path id="car-body-paint" class="car-body" d="
      M 90 270 
      L 100 240 
      C 105 220, 110 200, 130 185
      C 150 170, 185 160, 240 140
      C 270 130, 310 95, 380 90
      C 440 85, 520 90, 580 120
      C 610 135, 660 160, 690 190
      C 710 210, 730 220, 740 245
      C 745 260, 730 275, 715 280
      L 670 282
      C 665 250, 635 225, 590 225
      C 545 225, 515 250, 510 282
      L 290 282
      C 285 250, 255 225, 210 225
      C 165 225, 135 250, 130 282
      L 105 280
      C 95 278, 90 275, 90 270 Z" 
      fill="#00e5ff" 
    />

    <!-- Rear Spoiler/Fin detailing -->
    <path d="M 700 192 C 720 188, 735 185, 745 188 C 750 190, 748 198, 730 205 Z" fill="#090d16" opacity="0.8"/>

    <!-- 3. Windows (Glass & Pillars) -->
    <!-- Front & Rear Side Windows -->
    <path id="car-windows" d="
      M 260 148
      C 290 138, 320 115, 380 110
      C 430 106, 490 110, 540 132
      C 560 142, 575 155, 585 168
      L 480 168
      L 380 168
      L 260 168 Z" 
      fill="url(#windowGrad)" 
      stroke="#1e293b" 
      stroke-width="2" 
    />
    
    <!-- Window Pillars (A, B, C Pillars) -->
    <path d="M 370 110 L 380 110 L 385 168 L 375 168 Z" fill="#090d16" /> <!-- B-pillar -->
    <path d="M 480 112 L 490 114 L 485 168 L 475 168 Z" fill="#090d16" /> <!-- C-pillar -->
    <path d="M 260 148 L 270 145 L 290 168 L 280 168 Z" fill="#090d16" /> <!-- A-pillar -->

    <!-- Chrome Window Trim -->
    <path d="M 255 150 C 295 136, 335 108, 385 106 C 445 104, 515 108, 575 134 C 590 142, 600 152, 608 168 L 600 168 C 592 154, 582 146, 570 138 C 510 112, 442 108, 385 110 C 335 112, 290 138, 255 150" fill="url(#chromeGrad)" />

    <!-- 4. Body Styling Creases, Panels and Door Handles -->
    <!-- Character line (shoulder) -->
    <path d="M 120 220 Q 280 200, 500 200 T 710 225" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25" />
    <!-- Lower body scoop line -->
    <path d="M 220 250 L 500 250 Q 505 240, 510 235" fill="none" stroke="#000000" stroke-width="2" opacity="0.4" />
    <path d="M 220 251 L 500 251 Q 505 242, 510 236" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15" />
    
    <!-- Door Cutlines -->
    <path d="M 380 110 L 380 275" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.35" />
    <path d="M 275 168 C 275 220, 270 250, 260 278" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.35" />
    <path d="M 505 168 C 510 200, 520 240, 525 278" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.35" />

    <!-- Premium Flush Door Handles -->
    <rect x="350" y="180" width="22" height="6" rx="3" fill="url(#chromeGrad)" stroke="#090d16" stroke-width="0.5" />
    <rect x="475" y="182" width="22" height="6" rx="3" fill="url(#chromeGrad)" stroke="#090d16" stroke-width="0.5" />

    <!-- Fuel Cap (Round / Octagonal Sports Style) -->
    <circle cx="650" cy="165" r="10" fill="none" stroke="#000000" stroke-width="1" opacity="0.35" />
    <circle cx="650" cy="165" r="10" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />

    <!-- 5. Headlights and Taillights -->
    <!-- Headlight (Front) -->
    <path d="M 92 235 C 100 230, 115 225, 125 225 L 122 235 C 115 238, 102 242, 92 235 Z" fill="#ffffff" />
    <!-- Dynamic Headlight Flare/Beam (Optional display) -->
    <path id="headlight-beam" d="M 92 235 L 10 210 L 10 270 L 92 238 Z" fill="url(#headlightGrad)" opacity="0.4" />
    
    <!-- Tail Light (LED Strip Styling) -->
    <path d="M 735 205 C 738 200, 742 200, 745 204 L 738 215 C 735 212, 734 208, 735 205 Z" fill="#ff3333" filter="drop-shadow(0 0 3px #ff0000)" />
    <path d="M 700 215 H 738 L 735 219 H 705 Z" fill="#ff0000" />
    <path id="taillight-beam" d="M 740 205 L 790 200 L 790 230 L 738 215 Z" fill="url(#taillightGrad)" opacity="0.3" />

    <!-- Front & Rear Bumpers detailing -->
    <path d="M 90 260 H 120 L 115 272 H 95 Z" fill="#090d16" />
    <path d="M 710 265 L 732 263 L 730 273 L 712 273 Z" fill="#090d16" />

    <!-- 6. Wheels (Tires, Rims, Brake Discs and Calipers) -->
    <!-- Front Wheel Assembly -->
    <g id="front-wheel" class="car-wheel">
      <!-- Tire -->
      <circle cx="210" cy="270" r="48" fill="#1e293b" stroke="#0f172a" stroke-width="12" />
      <circle cx="210" cy="270" r="41" fill="#090d16" />
      
      <!-- Brake Disc -->
      <circle cx="210" cy="270" r="28" fill="#64748b" opacity="0.8" />
      <circle cx="210" cy="270" r="28" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2,2" />
      <!-- Red Brake Caliper -->
      <path d="M 190 252 C 190 248, 205 242, 215 248 L 210 258 C 205 256, 195 258, 190 252 Z" fill="#ff0055" />
      
      <!-- Premium Multi-spoke Rim (Interactive styling) -->
      <g id="front-rim" class="car-wheel-rim" fill="none" stroke="url(#chromeGrad)" stroke-width="2.5">
        <circle cx="210" cy="270" r="32" stroke-width="3" />
        <!-- Spoke Pairs -->
        <line x1="210" y1="270" x2="210" y2="238" />
        <line x1="210" y1="270" x2="210" y2="302" />
        <line x1="210" y1="270" x2="178" y2="270" />
        <line x1="210" y1="270" x2="242" y2="270" />
        
        <line x1="210" y1="270" x2="187" y2="247" />
        <line x1="210" y1="270" x2="233" y2="293" />
        <line x1="210" y1="270" x2="187" y2="293" />
        <line x1="210" y1="270" x2="233" y2="247" />

        <line x1="210" y1="270" x2="198" y2="239" />
        <line x1="210" y1="270" x2="222" y2="301" />
        <line x1="210" y1="270" x2="198" y2="301" />
        <line x1="210" y1="270" x2="222" y2="239" />

        <line x1="210" y1="270" x2="179" y2="258" />
        <line x1="210" y1="270" x2="241" y2="282" />
        <line x1="210" y1="270" x2="179" y2="282" />
        <line x1="210" y1="270" x2="241" y2="258" />

        <circle cx="210" cy="270" r="10" fill="#090d16" stroke-width="2" />
        <circle cx="210" cy="270" r="3" fill="#cbd5e1" />
      </g>
    </g>

    <!-- Rear Wheel Assembly -->
    <g id="rear-wheel" class="car-wheel">
      <!-- Tire -->
      <circle cx="590" cy="270" r="48" fill="#1e293b" stroke="#0f172a" stroke-width="12" />
      <circle cx="590" cy="270" r="41" fill="#090d16" />
      
      <!-- Brake Disc -->
      <circle cx="590" cy="270" r="28" fill="#64748b" opacity="0.8" />
      <circle cx="590" cy="270" r="28" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2,2" />
      <!-- Red Brake Caliper -->
      <path d="M 570 252 C 570 248, 585 242, 595 248 L 590 258 C 585 256, 575 258, 570 252 Z" fill="#ff0055" />
      
      <!-- Premium Multi-spoke Rim (Interactive styling) -->
      <g id="rear-rim" class="car-wheel-rim" fill="none" stroke="url(#chromeGrad)" stroke-width="2.5">
        <circle cx="590" cy="270" r="32" stroke-width="3" />
        <!-- Spoke Pairs -->
        <line x1="590" y1="270" x2="590" y2="238" />
        <line x1="590" y1="270" x2="590" y2="302" />
        <line x1="590" y1="270" x2="558" y2="270" />
        <line x1="590" y1="270" x2="622" y2="270" />
        
        <line x1="590" y1="270" x2="567" y2="247" />
        <line x1="590" y1="270" x2="613" y2="293" />
        <line x1="590" y1="270" x2="567" y2="293" />
        <line x1="590" y1="270" x2="613" y2="247" />

        <line x1="590" y1="270" x2="578" y2="239" />
        <line x1="590" y1="270" x2="602" y2="301" />
        <line x1="590" y1="270" x2="578" y2="301" />
        <line x1="590" y1="270" x2="602" y2="239" />

        <line x1="590" y1="270" x2="559" y2="258" />
        <line x1="590" y1="270" x2="621" y2="282" />
        <line x1="590" y1="270" x2="559" y2="282" />
        <line x1="590" y1="270" x2="621" y2="258" />

        <circle cx="590" cy="270" r="10" fill="#090d16" stroke-width="2" />
        <circle cx="590" cy="270" r="3" fill="#cbd5e1" />
      </g>
    </g>
  </g>
</svg>
