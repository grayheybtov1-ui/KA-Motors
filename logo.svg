<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium Chrome/Metallic Gradient for Logo -->
    <linearGradient id="premiumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#9d00ff" />
    </linearGradient>
    
    <!-- Sophisticated Dark Theme Gradient -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- KAI Logo Mark -->
  <g id="kai-brand" fill="currentColor">
    <!-- "K" Letter -->
    <path d="M 60 120 L 110 120 L 110 290 L 60 290 Z" />
    <path d="M 110 205 L 210 120 L 275 120 L 160 215 L 110 205 Z" />
    <path d="M 150 205 L 265 290 L 200 290 L 110 220 L 110 205 Z" />

    <!-- "A" Letter (Styled as an open triangle/lambda) -->
    <path d="M 270 120 L 335 120 L 400 290 L 345 290 L 302.5 175 L 260 290 L 210 290 L 270 120 Z" />
    <!-- Inner Triangle Cutout -->
    <!-- <path d="M 302.5 180 L 330 255 L 275 255 Z" fill="#0f172a" /> -->
    
    <!-- "I" Letter -->
    <path d="M 410 120 L 460 120 L 460 290 L 410 290 Z" />
  </g>

  <!-- "MOTORS" Subtext in bold, wide, italicized futuristic font -->
  <text x="250" y="360" 
        font-family="'Outfit', 'Montserrat', 'Inter', sans-serif" 
        font-size="54" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="9" 
        text-anchor="middle" 
        fill="currentColor">MOTORS</text>
</svg>
